<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Timeline Painter</title>

    <style>
        :root {
            --background: #f4f6f8;
            --panel: #ffffff;
            --border: #cbd2d9;
            --dark-border: #9aa5b1;
            --text: #17202a;
            --muted: #637381;
            --primary: #2563eb;
            --danger: #dc2626;
            --name-width: 160px;
            --cell-height: 54px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: 100%;
            margin: 0;
            padding: 20px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(16, 24, 40, 0.06);
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field input,
        .field select {
            height: 40px;
            padding: 0 10px;
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
        }

        .field input:focus,
        .field select:focus,
        .row-name:focus {
            outline: 3px solid rgba(37, 99, 235, 0.17);
            border-color: var(--primary);
        }

        .normal-button {
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: white;
            color: var(--text);
            font-weight: 700;
        }

        .normal-button:hover {
            background: #f8fafc;
            border-color: var(--dark-border);
        }

        .primary-button {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
        }

        .primary-button:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .danger-button {
            color: var(--danger);
        }

        .display-button {
            color: white;
            background: #047857;
            border-color: #047857;
        }

        .display-button:hover {
            color: white;
            background: #065f46;
            border-color: #065f46;
        }

        .toolbar {
            padding: 16px;
            margin-bottom: 16px;
        }

        .toolbar-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .toolbar-heading strong {
            font-size: 15px;
        }

        .tool-help {
            color: var(--muted);
            font-size: 13px;
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .event-button,
        .eraser-button {
            position: relative;
            min-width: 48px;
            height: 46px;
            padding: 0 12px;
            border: 3px solid transparent;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 900;
            transition:
                transform 100ms ease,
                box-shadow 100ms ease;
        }

        .event-button:hover,
        .eraser-button:hover {
            transform: translateY(-1px);
        }

        .event-button.selected,
        .eraser-button.selected {
            z-index: 1;
            border-color: #111827;
            box-shadow:
                0 0 0 3px white,
                0 0 0 5px #111827;
        }

        .eraser-button {
            min-width: 90px;
            background: white;
            color: var(--text);
            border-color: var(--border);
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e5e7eb;
        }

        .display-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 8px;
            margin-left: auto;
        }

        .display-controls .field select {
            min-width: 140px;
        }

        .schedule-panel {
            width: 100%;
            overflow: hidden;
        }

        .schedule-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .schedule-title h2 {
            margin: 0;
            font-size: 18px;
        }

        .selected-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .selected-swatch {
            width: 25px;
            height: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #111;
            border: 1px solid rgba(0, 0, 0, 0.35);
            border-radius: 5px;
            font-weight: 900;
        }

        .timeline-wrapper {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            background: #f8fafc;
        }

        .timeline {
            width: 100%;
            min-width: 0;
            padding-bottom: 8px;
        }

        .timeline-header,
        .timeline-row {
            display: grid;
            width: 100%;
            grid-template-columns:
                var(--name-width)
                repeat(var(--columns), minmax(0, 1fr));
        }

        .timeline-header {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .corner {
            position: sticky;
            left: 0;
            z-index: 8;
            min-width: 0;
            min-height: 49px;
            display: flex;
            align-items: center;
            padding: 10px;
            background: #1f2937;
            color: white;
            border-right: 2px solid white;
            font-size: 12px;
            font-weight: 800;
        }

        .time-label {
            min-width: 0;
            min-height: 49px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 4px 2px;
            background: #1f2937;
            color: white;
            border-right: 1px solid #4b5563;
            text-align: center;
            font-size: clamp(8px, 0.75vw, 11px);
            line-height: 1.1;
        }

        .time-label span {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .time-label small {
            font-size: inherit;
        }

        .timeline-row {
            border-bottom: 1px solid var(--dark-border);
        }

        .timeline-row:last-child {
            border-bottom: 0;
        }

        .row-name-wrap {
            position: sticky;
            left: 0;
            z-index: 4;
            min-width: 0;
            min-height: var(--cell-height);
            display: flex;
            align-items: center;
            padding: 6px 8px;
            background: #eef2f6;
            border-right: 2px solid var(--dark-border);
        }

        .row-name {
            width: 100%;
            min-width: 0;
            padding: 7px 8px;
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-weight: 750;
        }

        .time-cell {
            min-width: 0;
            min-height: var(--cell-height);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: white;
            color: #111827;
            border-right: 1px solid var(--dark-border);
            font-size: clamp(11px, 1.1vw, 18px);
            font-weight: 900;
            user-select: none;
            touch-action: none;
            cursor: crosshair;
            transition:
                filter 80ms ease,
                transform 80ms ease;
        }

        .time-cell:hover {
            filter: brightness(0.92);
            box-shadow:
                inset 0 0 0 3px rgba(17, 24, 39, 0.4);
        }

        .time-cell:active {
            transform: scale(0.95);
        }

        .time-cell.hour-start {
            border-left: 3px solid #475569;
        }

        .empty-message {
            padding: 50px 20px;
            color: var(--muted);
            text-align: center;
        }

        .status {
            min-height: 24px;
            padding: 8px 2px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status.success {
            color: #047857;
        }

        .status.error {
            color: #b91c1c;
        }

        /*
         * This button is only visible in distraction-free
         * timeline display mode.
         */
        .exit-display-button {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: none;
            min-height: 40px;
            padding: 8px 14px;
            background: #111827;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            font-weight: 800;
        }

        .exit-display-button:hover {
            background: #374151;
        }

        /*
         * Distraction-free display mode.
         * This displays the timeline in the HTML page.
         * It does not open the browser print dialog.
         */
        body.timeline-display-mode {
            --cell-height: 58px;
            min-height: 100vh;
            overflow: auto;
            background: #dfe4ea;
        }

        body.timeline-display-mode .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 64px 18px 24px;
        }

        body.timeline-display-mode .title-row,
        body.timeline-display-mode .settings,
        body.timeline-display-mode .toolbar,
        body.timeline-display-mode .schedule-title,
        body.timeline-display-mode .status {
            display: none !important;
        }

        body.timeline-display-mode .exit-display-button {
            display: block;
        }

        body.timeline-display-mode .schedule-panel {
            width: 100%;
            margin: 0 auto;
            overflow: visible;
            background: white;
            border: 0;
            border-radius: 0;
            box-shadow: 0 8px 35px rgba(15, 23, 42, 0.2);
        }

        body.timeline-display-mode.display-landscape
        .schedule-panel {
            max-width: 1600px;
        }

        body.timeline-display-mode.display-portrait
        .schedule-panel {
            max-width: 900px;
        }

        body.timeline-display-mode .timeline-wrapper {
            width: 100%;
            max-width: none;
            overflow: visible;
            background: white;
        }

        body.timeline-display-mode .timeline {
            padding: 0;
            background: white;
        }

        body.timeline-display-mode .timeline-header {
            top: 0;
        }

        body.timeline-display-mode .row-name {
            padding: 7px 3px;
            background: transparent;
            border-color: transparent;
            border-radius: 0;
            outline: none;
            pointer-events: none;
        }

        body.timeline-display-mode .time-cell {
            cursor: default;
            pointer-events: none;
            transition: none;
        }

        body.timeline-display-mode .time-cell:hover {
            filter: none;
            box-shadow: none;
        }

        body.timeline-display-mode .time-cell:active {
            transform: none;
        }

        @media (max-width: 700px) {
            :root {
                --name-width: 110px;
            }

            .page {
                padding: 10px;
            }

            .title-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .settings {
                align-items: stretch;
            }

            .field {
                flex: 1 1 130px;
            }

            .settings .normal-button {
                flex: 1 1 100%;
            }

            .toolbar-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .action-row {
                align-items: stretch;
                flex-direction: column;
            }

            .display-controls {
                width: 100%;
                margin-left: 0;
            }

            .display-controls .field {
                flex: 1 1 100%;
            }

            .display-controls .normal-button {
                flex: 1 1 100%;
            }

            .time-label {
                padding: 3px 1px;
                font-size: 7px;
            }

            .time-cell {
                font-size: 11px;
            }

            .row-name-wrap {
                padding: 5px;
            }

            .row-name {
                padding: 7px 5px;
                font-size: 12px;
            }

            body.timeline-display-mode {
                --name-width: 105px;
                --cell-height: 52px;
            }

            body.timeline-display-mode .page {
                padding: 62px 6px 10px;
            }

            body.timeline-display-mode .schedule-panel {
                box-shadow: none;
            }

            .exit-display-button {
                top: 8px;
                right: 8px;
            }
        }
    </style>
</head>

<body>
<button
    id="exitDisplayButton"
    class="exit-display-button"
    type="button"
>
    ✕ Exit Display
</button>

<div class="page">
    <header class="title-row">
        <div>
            <h1>Timeline Painter</h1>

            <p class="subtitle">
                Quickly mark matching events with the same number and color.
            </p>
        </div>
    </header>

    <section class="panel settings">
        <div class="field">
            <label for="rowCount">
                Number of strips
            </label>

            <input
                id="rowCount"
                type="number"
                min="1"
                max="50"
                value="4"
            >
        </div>

        <div class="field">
            <label for="startTime">
                Start time
            </label>

            <input
                id="startTime"
                type="time"
                value="09:00"
            >
        </div>

        <div class="field">
            <label for="endTime">
                End time
            </label>

            <input
                id="endTime"
                type="time"
                value="18:00"
            >
        </div>

        <div class="field">
            <label for="interval">
                Box length
            </label>

            <select id="interval">
                <option value="15">
                    15 minutes
                </option>

                <option value="30" selected>
                    30 minutes
                </option>

                <option value="60">
                    60 minutes
                </option>
            </select>
        </div>

        <div class="field">
            <label for="eventCount">
                Event numbers
            </label>

            <select id="eventCount">
                <option value="8">1–8</option>
                <option value="12" selected>1–12</option>
                <option value="16">1–16</option>
                <option value="20">1–20</option>
                <option value="30">1–30</option>
            </select>
        </div>

        <button
            id="generateButton"
            class="normal-button primary-button"
            type="button"
        >
            Create / Reset Timeline
        </button>
    </section>

    <section class="panel toolbar">
        <div class="toolbar-heading">
            <strong>
                Choose a number, then click or drag across boxes
            </strong>

            <span class="tool-help">
                Right-click a box to erase it
            </span>
        </div>

        <div id="palette" class="palette"></div>

        <div class="action-row">
            <button
                id="undoButton"
                class="normal-button"
                type="button"
            >
                ↶ Undo
            </button>

            <button
                id="clearButton"
                class="normal-button danger-button"
                type="button"
            >
                Clear Boxes
            </button>

            <div class="display-controls">
                <div class="field">
                    <label for="displayOrientation">
                        Display orientation
                    </label>

                    <select id="displayOrientation">
                        <option value="landscape" selected>
                            Landscape
                        </option>

                        <option value="portrait">
                            Portrait
                        </option>
                    </select>
                </div>

                <button
                    id="displayButton"
                    class="normal-button display-button"
                    type="button"
                >
                    ⛶ Display Timeline
                </button>
            </div>
        </div>
    </section>

    <section class="panel schedule-panel">
        <div class="schedule-title">
            <h2>Schedule</h2>

            <div class="selected-indicator">
                Selected:

                <span
                    id="selectedSwatch"
                    class="selected-swatch"
                >
                    1
                </span>

                <span id="selectedText">
                    Event 1
                </span>
            </div>
        </div>

        <div
            id="timelineWrapper"
            class="timeline-wrapper"
        >
            <div
                id="timeline"
                class="timeline"
            ></div>
        </div>
    </section>

    <div
        id="status"
        class="status"
        aria-live="polite"
    ></div>
</div>

<script>
    const COLORS = [
        "#fca5a5",
        "#fdba74",
        "#fde047",
        "#86efac",
        "#5eead4",
        "#7dd3fc",
        "#93c5fd",
        "#c4b5fd",
        "#f0abfc",
        "#f9a8d4",
        "#bef264",
        "#67e8f9",
        "#d8b4fe",
        "#fda4af",
        "#a7f3d0",
        "#fed7aa",
        "#bfdbfe",
        "#ddd6fe",
        "#fecdd3",
        "#bbf7d0",
        "#bae6fd",
        "#e9d5ff",
        "#fde68a",
        "#99f6e4",
        "#c7d2fe",
        "#f5d0fe",
        "#d9f99d",
        "#fecaca",
        "#a5f3fc",
        "#e2e8f0"
    ];

    const rowCountInput =
        document.getElementById("rowCount");

    const startTimeInput =
        document.getElementById("startTime");

    const endTimeInput =
        document.getElementById("endTime");

    const intervalInput =
        document.getElementById("interval");

    const eventCountInput =
        document.getElementById("eventCount");

    const displayOrientationInput =
        document.getElementById("displayOrientation");

    const generateButton =
        document.getElementById("generateButton");

    const undoButton =
        document.getElementById("undoButton");

    const clearButton =
        document.getElementById("clearButton");

    const displayButton =
        document.getElementById("displayButton");

    const exitDisplayButton =
        document.getElementById("exitDisplayButton");

    const paletteElement =
        document.getElementById("palette");

    const timelineElement =
        document.getElementById("timeline");

    const statusElement =
        document.getElementById("status");

    const selectedSwatch =
        document.getElementById("selectedSwatch");

    const selectedText =
        document.getElementById("selectedText");

    let state = {
        rowCount: 4,
        startTime: "09:00",
        endTime: "18:00",
        interval: 30,
        eventCount: 12,

        rowNames: [
            "Strip 1",
            "Strip 2",
            "Strip 3",
            "Strip 4"
        ],

        cells: []
    };

    let selectedEvent = 1;
    let isPainting = false;
    let activePointerId = null;
    let history = [];

    function timeToMinutes(time) {
        const parts = time.split(":").map(Number);

        return parts[0] * 60 + parts[1];
    }

    function shortTime(minutes) {
        const normalized =
            ((minutes % 1440) + 1440) % 1440;

        const hour24 =
            Math.floor(normalized / 60);

        const minute =
            normalized % 60;

        const hour12 =
            hour24 % 12 || 12;

        const minuteText =
            minute === 0
                ? ""
                : `:${String(minute).padStart(2, "0")}`;

        return `${hour12}${minuteText}`;
    }

    function getColumnCount() {
        const start =
            timeToMinutes(state.startTime);

        const end =
            timeToMinutes(state.endTime);

        return Math.floor(
            (end - start) / state.interval
        );
    }

    function makeEmptyCells(rows, columns) {
        return Array.from(
            { length: rows },
            () => Array(columns).fill(0)
        );
    }

    function getColor(eventNumber) {
        return COLORS[
            (eventNumber - 1) % COLORS.length
        ];
    }

    function setStatus(message, type = "") {
        statusElement.textContent = message;
        statusElement.className =
            `status ${type}`;

        clearTimeout(setStatus.timeout);

        setStatus.timeout = setTimeout(() => {
            statusElement.textContent = "";
            statusElement.className = "status";
        }, 3000);
    }

    function createPalette() {
        paletteElement.innerHTML = "";

        for (
            let number = 1;
            number <= state.eventCount;
            number++
        ) {
            const button =
                document.createElement("button");

            button.type = "button";
            button.className = "event-button";
            button.dataset.event = number;
            button.textContent = number;

            button.style.backgroundColor =
                getColor(number);

            button.title =
                `Paint event ${number}`;

            if (selectedEvent === number) {
                button.classList.add("selected");
            }

            button.addEventListener("click", () => {
                selectedEvent = number;
                updateSelectedTool();
            });

            paletteElement.appendChild(button);
        }

        const eraserButton =
            document.createElement("button");

        eraserButton.type = "button";
        eraserButton.className = "eraser-button";
        eraserButton.dataset.event = "0";
        eraserButton.textContent = "⌫ Eraser";

        if (selectedEvent === 0) {
            eraserButton.classList.add("selected");
        }

        eraserButton.addEventListener("click", () => {
            selectedEvent = 0;
            updateSelectedTool();
        });

        paletteElement.appendChild(eraserButton);
    }

    function updateSelectedTool() {
        document
            .querySelectorAll(
                ".event-button, .eraser-button"
            )
            .forEach(button => {
                const buttonValue =
                    Number(button.dataset.event);

                button.classList.toggle(
                    "selected",
                    buttonValue === selectedEvent
                );
            });

        if (selectedEvent === 0) {
            selectedSwatch.textContent = "⌫";

            selectedSwatch.style.backgroundColor =
                "#ffffff";

            selectedText.textContent = "Eraser";
        } else {
            selectedSwatch.textContent =
                selectedEvent;

            selectedSwatch.style.backgroundColor =
                getColor(selectedEvent);

            selectedText.textContent =
                `Event ${selectedEvent}`;
        }
    }

    function renderTimeline() {
        const columns = getColumnCount();

        timelineElement.innerHTML = "";

        timelineElement.style.setProperty(
            "--columns",
            columns
        );

        if (columns <= 0) {
            timelineElement.innerHTML = `
                <div class="empty-message">
                    The end time must be later than the
                    start time.
                </div>
            `;

            return;
        }

        const startMinutes =
            timeToMinutes(state.startTime);

        const header =
            document.createElement("div");

        header.className = "timeline-header";

        const corner =
            document.createElement("div");

        corner.className = "corner";
        corner.textContent = "STRIP / TIME";

        header.appendChild(corner);

        for (
            let column = 0;
            column < columns;
            column++
        ) {
            const start =
                startMinutes +
                column * state.interval;

            const end =
                start + state.interval;

            const label =
                document.createElement("div");

            label.className = "time-label";

            label.innerHTML = `
                <span>
                    ${shortTime(start)}
                    <br>
                    <small>–${shortTime(end)}</small>
                </span>
            `;

            header.appendChild(label);
        }

        timelineElement.appendChild(header);

        for (
            let row = 0;
            row < state.rowCount;
            row++
        ) {
            const rowElement =
                document.createElement("div");

            rowElement.className = "timeline-row";

            const nameWrap =
                document.createElement("div");

            nameWrap.className = "row-name-wrap";

            const nameInput =
                document.createElement("input");

            nameInput.className = "row-name";
            nameInput.type = "text";

            nameInput.value =
                state.rowNames[row] ||
                `Strip ${row + 1}`;

            nameInput.setAttribute(
                "aria-label",
                `Name for strip ${row + 1}`
            );

            nameInput.addEventListener("input", () => {
                state.rowNames[row] =
                    nameInput.value ||
                    `Strip ${row + 1}`;
            });

            nameWrap.appendChild(nameInput);
            rowElement.appendChild(nameWrap);

            for (
                let column = 0;
                column < columns;
                column++
            ) {
                const cell =
                    document.createElement("div");

                const start =
                    startMinutes +
                    column * state.interval;

                const eventNumber =
                    state.cells[row]?.[column] || 0;

                cell.className = "time-cell";
                cell.dataset.row = row;
                cell.dataset.column = column;

                if (start % 60 === 0) {
                    cell.classList.add("hour-start");
                }

                paintCellAppearance(
                    cell,
                    eventNumber
                );

                cell.addEventListener(
                    "pointerdown",
                    event => {
                        if (event.button !== 0) {
                            return;
                        }

                        if (
                            document.body.classList.contains(
                                "timeline-display-mode"
                            )
                        ) {
                            return;
                        }

                        event.preventDefault();

                        pushHistory();

                        isPainting = true;
                        activePointerId =
                            event.pointerId;

                        paintCell(
                            row,
                            column,
                            selectedEvent
                        );
                    }
                );

                cell.addEventListener(
                    "pointerenter",
                    event => {
                        if (
                            isPainting &&
                            event.pointerId ===
                                activePointerId
                        ) {
                            paintCell(
                                row,
                                column,
                                selectedEvent
                            );
                        }
                    }
                );

                cell.addEventListener(
                    "contextmenu",
                    event => {
                        event.preventDefault();

                        if (
                            document.body.classList.contains(
                                "timeline-display-mode"
                            )
                        ) {
                            return;
                        }

                        if (
                            state.cells[row][column] === 0
                        ) {
                            return;
                        }

                        pushHistory();
                        paintCell(row, column, 0);
                    }
                );

                rowElement.appendChild(cell);
            }

            timelineElement.appendChild(
                rowElement
            );
        }
    }

    function paintCellAppearance(
        cell,
        eventNumber
    ) {
        if (!eventNumber) {
            cell.textContent = "";

            cell.style.backgroundColor =
                "#ffffff";

            cell.removeAttribute("data-filled");

            return;
        }

        cell.textContent = eventNumber;

        cell.style.backgroundColor =
            getColor(eventNumber);

        cell.dataset.filled = "true";
    }

    function paintCell(
        row,
        column,
        eventNumber
    ) {
        if (
            state.cells[row][column] ===
            eventNumber
        ) {
            return;
        }

        state.cells[row][column] =
            eventNumber;

        const cell =
            timelineElement.querySelector(
                `.time-cell[data-row="${row}"]` +
                `[data-column="${column}"]`
            );

        if (cell) {
            paintCellAppearance(
                cell,
                eventNumber
            );
        }
    }

    function pushHistory() {
        history.push(
            JSON.stringify(state.cells)
        );

        if (history.length > 50) {
            history.shift();
        }
    }

    function undo() {
        if (history.length === 0) {
            setStatus("Nothing to undo.");
            return;
        }

        state.cells =
            JSON.parse(history.pop());

        renderTimeline();

        setStatus(
            "Last change undone.",
            "success"
        );
    }

    function clearTimeline() {
        const containsEvents =
            state.cells.some(row =>
                row.some(value => value !== 0)
            );

        if (!containsEvents) {
            setStatus(
                "The timeline is already empty."
            );

            return;
        }

        const confirmed = confirm(
            "Clear all numbered boxes? " +
            "Strip names and time settings will remain."
        );

        if (!confirmed) {
            return;
        }

        pushHistory();

        state.cells = makeEmptyCells(
            state.rowCount,
            getColumnCount()
        );

        renderTimeline();

        setStatus(
            "All boxes cleared.",
            "success"
        );
    }

    function generateTimeline() {
        const rows =
            Number(rowCountInput.value);

        const interval =
            Number(intervalInput.value);

        const start =
            startTimeInput.value;

        const end =
            endTimeInput.value;

        const eventCount =
            Number(eventCountInput.value);

        if (
            !Number.isInteger(rows) ||
            rows < 1 ||
            rows > 50
        ) {
            setStatus(
                "Enter between 1 and 50 timeline strips.",
                "error"
            );

            return;
        }

        if (
            !start ||
            !end ||
            timeToMinutes(end) <=
                timeToMinutes(start)
        ) {
            setStatus(
                "The end time must be later than the start time.",
                "error"
            );

            return;
        }

        const duration =
            timeToMinutes(end) -
            timeToMinutes(start);

        if (duration % interval !== 0) {
            setStatus(
                "The time range must divide evenly " +
                "into the selected box length.",
                "error"
            );

            return;
        }

        const hasData =
            state.cells.some(row =>
                row.some(value => value !== 0)
            );

        if (hasData) {
            const confirmed = confirm(
                "Creating a new timeline will clear " +
                "the current boxes. Continue?"
            );

            if (!confirmed) {
                return;
            }
        }

        const oldNames =
            [...state.rowNames];

        state = {
            rowCount: rows,
            startTime: start,
            endTime: end,
            interval,
            eventCount,

            rowNames: Array.from(
                { length: rows },
                (_, index) =>
                    oldNames[index] ||
                    `Strip ${index + 1}`
            ),

            cells: makeEmptyCells(
                rows,
                duration / interval
            )
        };

        if (selectedEvent > eventCount) {
            selectedEvent = 1;
        }

        history = [];

        createPalette();
        renderTimeline();
        updateSelectedTool();

        setStatus(
            "New timeline created.",
            "success"
        );
    }

    function applyDisplayOrientation() {
        const portrait =
            displayOrientationInput.value ===
            "portrait";

        document.body.classList.toggle(
            "display-portrait",
            portrait
        );

        document.body.classList.toggle(
            "display-landscape",
            !portrait
        );
    }

    function enterDisplayMode() {
        const columns = getColumnCount();

        if (columns <= 0) {
            setStatus(
                "Create a valid timeline before displaying it.",
                "error"
            );

            return;
        }

        if (document.activeElement) {
            document.activeElement.blur();
        }

        isPainting = false;
        activePointerId = null;

        applyDisplayOrientation();

        document.body.classList.add(
            "timeline-display-mode"
        );

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });

        exitDisplayButton.focus();
    }

    function exitDisplayMode() {
        document.body.classList.remove(
            "timeline-display-mode",
            "display-landscape",
            "display-portrait"
        );

        displayButton.focus();
    }

    function initializeTimeline() {
        const columns =
            (
                timeToMinutes(state.endTime) -
                timeToMinutes(state.startTime)
            ) / state.interval;

        state.cells = makeEmptyCells(
            state.rowCount,
            columns
        );

        rowCountInput.value =
            state.rowCount;

        startTimeInput.value =
            state.startTime;

        endTimeInput.value =
            state.endTime;

        intervalInput.value =
            state.interval;

        eventCountInput.value =
            state.eventCount;

        createPalette();
        renderTimeline();
        updateSelectedTool();
    }

    document.addEventListener(
        "pointerup",
        event => {
            if (
                isPainting &&
                (
                    activePointerId === null ||
                    event.pointerId ===
                        activePointerId
                )
            ) {
                isPainting = false;
                activePointerId = null;
            }
        }
    );

    document.addEventListener(
        "pointercancel",
        () => {
            isPainting = false;
            activePointerId = null;
        }
    );

    generateButton.addEventListener(
        "click",
        generateTimeline
    );

    undoButton.addEventListener(
        "click",
        undo
    );

    clearButton.addEventListener(
        "click",
        clearTimeline
    );

    displayButton.addEventListener(
        "click",
        enterDisplayMode
    );

    exitDisplayButton.addEventListener(
        "click",
        exitDisplayMode
    );

    displayOrientationInput.addEventListener(
        "change",
        () => {
            if (
                document.body.classList.contains(
                    "timeline-display-mode"
                )
            ) {
                applyDisplayOrientation();
            }
        }
    );

    document.addEventListener(
        "keydown",
        event => {
            const displayModeActive =
                document.body.classList.contains(
                    "timeline-display-mode"
                );

            if (
                event.key === "Escape" &&
                displayModeActive
            ) {
                event.preventDefault();
                exitDisplayMode();
                return;
            }

            if (displayModeActive) {
                return;
            }

            const activeTag =
                document.activeElement?.tagName;

            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "z" &&
                activeTag !== "INPUT"
            ) {
                event.preventDefault();
                undo();
            }

            if (
                event.key.toLowerCase() === "e" &&
                activeTag !== "INPUT" &&
                activeTag !== "SELECT"
            ) {
                selectedEvent = 0;
                updateSelectedTool();
            }

            if (
                /^[1-9]$/.test(event.key) &&
                activeTag !== "INPUT" &&
                activeTag !== "SELECT"
            ) {
                const number =
                    Number(event.key);

                if (
                    number <= state.eventCount
                ) {
                    selectedEvent = number;
                    updateSelectedTool();
                }
            }
        }
    );

    /*
     * No localStorage or other persistent browser
     * storage is used anywhere in this application.
     */
    initializeTimeline();
</script>
</body>
</html>
